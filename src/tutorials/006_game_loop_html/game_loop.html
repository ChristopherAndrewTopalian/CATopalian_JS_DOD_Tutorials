<!DOCTYPE html>
<html lang = 'en'>
<head>
<title> Game Loop </title>

<meta charset = 'UTF-8'>

<meta name = 'viewport' content = 'width=device-width, initial-scale=1.0'>

<style>

body
{
    background-color: rgb(30, 30, 30);
    color: rgb(255, 255, 255);
}

</style>

<script>

let world = {};

//----//

// shortcuts.js

function ge(whichId)
{
    let result = document.getElementById(whichId);
    return result;
}

function ce(whichType)
{
    let result = document.createElement(whichType);
    return result;
}

function ba(whichElement)
{
    let result = document.body.append(whichElement);
    return result;
}

//----//

// make entity object data and physical DOM element
function makeEntity(name, x, y, width, height)
{
    // Create the physical monitor (the DOM element)
    let visual = ce('div');
    visual.id = name;
    visual.style.position = 'absolute';
    visual.style.width = width + 'px';
    visual.style.height = height + 'px';
    visual.style.backgroundColor = 'rgb(0, 255, 255)'; 
    ba(visual);

    // Create the pure data
    let entityData = {
        name: name,
        width: width,
        height: height,
        id: name,
        x: x,
        y: y,
        vx: 0, 
        vy: 0,  
        shields: 100,
        energy: 100,
        emotion: 'neutral'
    };

    return entityData;
}

// movementSystem.js
function movementSystem()
{
    for (let i in world)
    {
        let currentData = world[i];

        // Apply the velocity to the pure data coordinates
        currentData.x += currentData.vx;
        currentData.y += currentData.vy;
    }
}

// only updates the screen
function updateVisuals()
{
    for (let i in world)
    {
        let currentData = world[i];
        let entity = ge(currentData.id);

        // Paint the pure data onto the physical monitor
        entity.style.left = currentData.x + 'px';
        entity.style.top = currentData.y + 'px';
    }
}

// collisionSystem.js

function collisionSystem() {
    // 1. Convert the world object into an array of entities for the math
    let entities = Object.values(world); 
    let count = entities.length;

    // 2. Loop through every unique pair of entities
    for (let i = 0; i < count; i++) {
        for (let j = i + 1; j < count; j++) {
            
            let e1 = entities[i];
            let e2 = entities[j];

            // AABB Collision Math: Check if their boxes overlap
            let isColliding = (
                e1.x < e2.x + e2.width &&
                e1.x + e1.width > e2.x &&
                e1.y < e2.y + e2.height &&
                e1.y + e1.height > e2.y
            );

            if (isColliding)
            {
                // Calculate the center points of both objects
                let center1X = e1.x + (e1.width / 2);
                let center1Y = e1.y + (e1.height / 2);
                let center2X = e2.x + (e2.width / 2);
                let center2Y = e2.y + (e2.height / 2);

                // Calculate the distance between centers
                let diffX = center1X - center2X;
                let diffY = center1Y - center2Y;

                // Determine the axis of least penetration (which way to push them)
                // We divide by width/height to normalize the overlap for rectangular objects
                if (Math.abs(diffX) / (e1.width + e2.width) > Math.abs(diffY) / (e1.height + e2.height))
                {
                    // HORIZONTAL COLLISION

                    // Separate them so they don't stick
                    let overlapX = (e1.width/2 + e2.width/2) - Math.abs(diffX);
                    if (diffX > 0)
                    {
                        e1.x += overlapX / 2;
                        e2.x -= overlapX / 2;
                    }
                    else
                    {
                        e1.x -= overlapX / 2;
                        e2.x += overlapX / 2;
                    }

                    // Swap horizontal velocities (Elastic Bounce)
                    let tempVx = e1.vx;
                    e1.vx = e2.vx;
                    e2.vx = tempVx;
                }
                else
                {
                    // VERTICAL COLLISION
                    // Separate them so they don't stick
                    let overlapY = (e1.height/2 + e2.height/2) - Math.abs(diffY);
                    if (diffY > 0)
                    {
                        e1.y += overlapY / 2;
                        e2.y -= overlapY / 2;
                    }
                    else
                    {
                        e1.y -= overlapY / 2;
                        e2.y += overlapY / 2;
                    }

                    // Swap vertical velocities (Elastic Bounce)
                    let tempVy = e1.vy;
                    e1.vy = e2.vy;
                    e2.vy = tempVy;
                }
            }
        }
    }
}

//----//

// boundarySystem.js

function boundarySystem() 
{
    let screenWidth = window.innerWidth;
    let screenHeight = window.innerHeight;

    for (let i in world)
    {
        let element = world[i];

        // LEFT WALL CHECK
        if (element.x < 0)
        {
            element.x = 0; 
            element.vx = element.vx * -1; 
        }
        // RIGHT WALL CHECK
        else if (element.x + element.width > screenWidth)
        {
            element.x = screenWidth - element.width; 
            element.vx = element.vx * -1; 
        }
        // TOP WALL CHECK
        if (element.y < 0)
        {
            element.y = 0;
            element.vy = element.vy * -1;
        }
        // BOTTOM WALL CHECK
        else if (element.y + element.height > screenHeight)
        {
            element.y = screenHeight - element.height;
            element.vy = element.vy * -1;
        }
    }
}

//----//

// define the game loop
function gameLoop()
{
    // Calculate the new math
    movementSystem();
    boundarySystem();
    collisionSystem();

    // Draw the new math
    updateVisuals();

    requestAnimationFrame(gameLoop);
}

//----//

function whenLoaded()
{
    // Create the ship ONCE
    world.enterprise = makeEntity('Enterprise', 50, 100, 50, 50);

    world.defiant = makeEntity('Defiant', 200, 100, 50, 50);

    // Give it a gentle push so velocity takes over in the loop
    world.enterprise.vx = 1.1;
    world.enterprise.vy = -1.1;

    world.defiant.vx = -1.1;
    world.defiant.vy = 1.1;

    // Start the engine
    gameLoop();
}

</script>

</head>

<body onload = "whenLoaded();">

</body>

</html>
