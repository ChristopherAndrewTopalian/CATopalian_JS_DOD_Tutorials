<!DOCTYPE html>
<html lang='en'>
<head>
<title> Game Loop: SimVillage (AOO State Machine) </title>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>

<style>

body
{
    background-color: rgb(30, 80, 40); /* Grassy Green Background */
    color: rgb(255, 255, 255);
    overflow: hidden;
    margin: 0;
    font-family: sans-serif;
}

.building {
    position: absolute;
    border: 2px solid white;
    background-color: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    text-shadow: 1px 1px 2px black;
}

</style>

<script>

let world = [];
let buildings = []; // A secondary array just for static locations

let keys = { w: false, a: false, s: false, d: false, space: false };

window.addEventListener('keydown', function(e) {
    if (e.key === 'w' || e.key === 'W') keys.w = true;
    if (e.key === 'a' || e.key === 'A') keys.a = true;
    if (e.key === 's' || e.key === 'S') keys.s = true;
    if (e.key === 'd' || e.key === 'D') keys.d = true;
    if (e.key === ' ') keys.space = true;
});

window.addEventListener('keyup', function(e) {
    if (e.key === 'w' || e.key === 'W') keys.w = false;
    if (e.key === 'a' || e.key === 'A') keys.a = false;
    if (e.key === 's' || e.key === 'S') keys.s = false;
    if (e.key === 'd' || e.key === 'D') keys.d = false;
    if (e.key === ' ') keys.space = false;
});

function ge(whichId) { return document.getElementById(whichId); }
function ce(whichType) { return document.createElement(whichType); }
function ba(whichElement) { return document.body.append(whichElement); }

function fibn(whichArray, whichName)
{
    let count = whichArray.length;
    for (let i = 0; i < count; i++)
    {
        if (whichArray[i].name === whichName) return i;
    }
    return -1;
}

//----//

// Building Spawner for the Village
function spawnBuilding(id, x, y, width, height, label, color) {
    let b = { id: id, x: x, y: y, width: width, height: height };
    
    let visual = ce('div');
    visual.id = id;
    visual.className = 'building';
    visual.textContent = label;
    visual.style.left = x + 'px';
    visual.style.top = y + 'px';
    visual.style.width = width + 'px';
    visual.style.height = height + 'px';
    visual.style.backgroundColor = color;
    
    ge('gameBoard').append(visual);
    buildings.push(b);
    return b;
}

//----//

function createEntityVisual(data)
{
    let visual = ce('div');
    visual.id = data.id;
    
    if (data.isBullet) { visual.textContent = ''; }
    else { visual.textContent = data.id; }
    
    visual.style.position = 'absolute';
    visual.style.width = data.width + 'px';
    visual.style.height = data.height + 'px';
    visual.style.backgroundColor = data.bgcolor;
    visual.style.padding = '0px';
    visual.style.margin = '0px';
    visual.style.borderRadius = '50%';
    visual.style.color = 'black';
    visual.style.fontSize = '10px';
    visual.style.textAlign = 'center';
    visual.style.lineHeight = data.height + 'px';
    visual.style.left = '0px'; 
    visual.style.top = '0px';
    visual.style.willChange = 'transform';
    visual.style.zIndex = '10'; // Keep people above buildings
    
    ge('gameBoard').append(visual);
    data.element = visual; 
    return visual;
}

function spawnData(dataObject)
{
    createEntityVisual(dataObject);
    world.push(dataObject);
    return dataObject;
}

function spawnEntity(name, x, y, width, height, bgcolor)
{
    let data = {
        name: name,
        id: name,
        width: width,
        height: height,
        bgcolor: bgcolor,
        x: x,
        y: y,
        vx: 0, 
        vy: 0,  
        isBullet: false,
        life: 0,
        // The Villager Brain
        si: { 
            state: 'idle',    // What am I doing?
            target: null,    // Where am I going?
            tick: 0        // Internal clock
        }
    };
    spawnData(data);
}

//----//

function playerInputSystem()
{
    let playerIndex = fibn(world, 'Mayor'); 
    if (playerIndex === -1) return;
    
    let player = world[playerIndex];
    let accel = 0.5;
    let friction = 0.92; 

    player.vx *= friction;
    player.vy *= friction;

    if (keys.w) player.vy -= accel;
    if (keys.s) player.vy += accel;
    if (keys.a) player.vx -= accel;
    if (keys.d) player.vx += accel;
}

// Intent-Based State Machine
function siSystem()
{
    let count = world.length;
    for (let i = 0; i < count; i++)
    {
        let entity = world[i];
        
        // Skip the Mayor (Player) and bullets
        if (entity.id === 'Mayor' || entity.isBullet) continue;

        entity.si.tick++; 

        // DECISION MAKING (Change state every 3-5 seconds randomly)
        if (entity.si.tick % (180 + Math.floor(Math.random() * 120)) === 0) 
        {
            let choices = ['go_home', 'go_market', 'go_park', 'wander'];
            entity.si.state = choices[Math.floor(Math.random() * choices.length)];
            
            // Assign the physical target based on the decision
            if (entity.si.state === 'go_home') entity.si.target = buildings[0];
            else if (entity.si.state === 'go_market') entity.si.target = buildings[1];
            else if (entity.si.state === 'go_park') entity.si.target = buildings[2];
            else entity.si.target = null; // Wandering has no specific target
        }

        // ACTION (Pathfinding based on state)
        let speed = 1.0;
        
        if (entity.si.target) 
        {
            // Simple Pathfinding: Walk toward the center of the target building
            let targetCenterX = entity.si.target.x + (entity.si.target.width / 2);
            let targetCenterY = entity.si.target.y + (entity.si.target.height / 2);
            let myCenterX = entity.x + (entity.width / 2);
            let myCenterY = entity.y + (entity.height / 2);

            let diffX = targetCenterX - myCenterX;
            let diffY = targetCenterY - myCenterY;
            let distance = Math.sqrt((diffX * diffX) + (diffY * diffY));

            // If we are far away, walk toward it. If we are close, stop.
            if (distance > 20) {
                // Normalize the vector so they walk at a constant speed diagonally
                entity.vx = (diffX / distance) * speed;
                entity.vy = (diffY / distance) * speed;
            } else {
                entity.vx = 0;
                entity.vy = 0;
            }
        } 
        else if (entity.si.state === 'wander')
        {
            // Random drunken walk
            if (entity.si.tick % 30 === 0) {
                entity.vx = (Math.random() * 2) - 1;
                entity.vy = (Math.random() * 2) - 1;
            }
        }
    }
}

//----//

function movementSystem()
{
    let count = world.length;
    for (let i = 0; i < count; i++)
    {
        world[i].x += world[i].vx;
        world[i].y += world[i].vy;
    }
}

function collisionSystem()
{
    // Kept exactly as you built it! Villagers still bump into each other.
    let count = world.length;
    for (let i = 0; i < count; i++)
    {
        for (let j = i + 1; j < count; j++)
        {
            let e1 = world[i];
            let e2 = world[j];

            let isColliding = (
                e1.x < e2.x + e2.width && e1.x + e1.width > e2.x &&
                e1.y < e2.y + e2.height && e1.y + e1.height > e2.y
            );

            if (isColliding)
            {
                let center1X = e1.x + (e1.width / 2);
                let center1Y = e1.y + (e1.height / 2);
                let center2X = e2.x + (e2.width / 2);
                let center2Y = e2.y + (e2.height / 2);

                let diffX = center1X - center2X;
                let diffY = center1Y - center2Y;

                if (Math.abs(diffX) / (e1.width + e2.width) > Math.abs(diffY) / (e1.height + e2.height))
                {
                    let overlapX = ((e1.width/2 + e2.width/2) - Math.abs(diffX)) * 1.05;
                    if (diffX > 0) { e1.x += overlapX / 2; e2.x -= overlapX / 2; }
                    else { e1.x -= overlapX / 2; e2.x += overlapX / 2; }

                    let tempVx = e1.vx;
                    e1.vx = e2.vx + (Math.random() * 0.01 - 0.005);
                    e2.vx = tempVx + (Math.random() * 0.01 - 0.005);
                }
                else
                {
                    let overlapY = ((e1.height/2 + e2.height/2) - Math.abs(diffY)) * 1.05;
                    if (diffY > 0) { e1.y += overlapY / 2; e2.y -= overlapY / 2; }
                    else { e1.y -= overlapY / 2; e2.y += overlapY / 2; }

                    let tempVy = e1.vy;
                    e1.vy = e2.vy + (Math.random() * 0.01 - 0.005);
                    e2.vy = tempVy + (Math.random() * 0.01 - 0.005);
                }
            }
        }
    }
}

function boundarySystem() 
{
    let screenWidth = window.innerWidth;
    let screenHeight = window.innerHeight;
    let count = world.length;

    for (let i = 0; i < count; i++)
    {
        let element = world[i];

        if (element.x < 0) { element.x = 0; element.vx = -element.vx; }
        else if (element.x + element.width > screenWidth) { element.x = screenWidth - element.width; element.vx = -element.vx; }
        
        if (element.y < 0) { element.y = 0; element.vy = -element.vy; }
        else if (element.y + element.height > screenHeight) { element.y = screenHeight - element.height; element.vy = -element.vy; }
    }
}

function updateVisuals()
{
    let count = world.length;
    for (let i = 0; i < count; i++)
    {
        let data = world[i];
        data.element.style.transform = `translate3d(${data.x}px, ${data.y}px, 0)`;
    }
}

//----//

function gameLoop()
{
    playerInputSystem(); 
    siSystem();          
    movementSystem();    
    boundarySystem();    
    collisionSystem();   
    updateVisuals();     
    
    requestAnimationFrame(gameLoop);
}

//----//

function createGameBoard()
{
    let gameBoard = ce('div');
    gameBoard.id = 'gameBoard';
    gameBoard.style.position = 'absolute';
    gameBoard.style.top = '0px';
    gameBoard.style.left = '0px';
    gameBoard.style.width = '100vw';
    gameBoard.style.height = '100vh';
    ba(gameBoard);
}

function whenLoaded()
{
    createGameBoard();
    
    // Build the Village Infrastructure
    spawnBuilding('home', 100, 100, 150, 150, 'Residential Zone', 'rgba(100, 100, 255, 0.4)');
    spawnBuilding('market', 500, 100, 200, 150, 'Town Market', 'rgba(255, 100, 100, 0.4)');
    spawnBuilding('park', 300, 400, 250, 200, 'Central Park', 'rgba(100, 255, 100, 0.4)');

    // Spawn the Villagers
    let colors = ['yellow', 'blue', 'red', 'purple', 'orange', 'cyan', 'pink'];

    for (let i = 1; i <= 15; i++)
    {
        let color = colors[i % colors.length];
        spawnEntity('p' + i, 300 + (Math.random()*100), 200 + (Math.random()*100), 20, 20, color);
    }
    
    // Spawn the Player (The Mayor)
    spawnEntity('Mayor', 400, 300, 25, 25, 'white'); 

    gameLoop();
}

</script>

</head>

<body onload="whenLoaded();">

</body>

</html>
